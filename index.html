<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UI/UX 기획자 & PM 포트폴리오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <p class="load-error" id="load-error" hidden>내용을 불러오지 못했어요. 잠시 후 새로고침해 주세요.</p>

    <div class="sheet">

      <!-- 왼쪽: ABOUT ME -->
      <aside class="about">
        <h2 class="small-label">ABOUT ME</h2>
        <div class="photo-frame">
          <img class="profile-photo" id="profile-photo" alt="프로필 사진" hidden>
          <div class="photo-placeholder" id="photo-placeholder" aria-hidden="true"></div>
        </div>
        <h1 class="name" id="profile-name"></h1>
        <p class="job-title" id="profile-title"></p>
        <p class="career-badge" id="profile-career" hidden></p>

        <ul class="contact">
          <li>
            <span class="contact-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
            </span>
            <span class="contact-text">
              <span class="contact-label">이름</span>
              <span id="contact-name"></span>
            </span>
          </li>
          <li>
            <span class="contact-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
            </span>
            <span class="contact-text">
              <span class="contact-label">이메일</span>
              <span id="contact-email"></span>
            </span>
          </li>
          <li>
            <span class="contact-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
            </span>
            <span class="contact-text">
              <span class="contact-label">연락처</span>
              <span id="contact-phone"></span>
            </span>
          </li>
          <li>
            <span class="contact-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
            </span>
            <span class="contact-text">
              <span class="contact-label">위치</span>
              <span id="contact-location"></span>
            </span>
          </li>
        </ul>
      </aside>

      <!-- 오른쪽: PORTFOLIO -->
      <section class="content">
        <h2 class="big-title">PORTFOLIO</h2>
        <p class="headline" id="profile-headline"></p>
        <p class="intro" id="profile-intro"></p>

        <div class="info-grid">
          <section class="info-box">
            <h3 class="info-title">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/></svg>
              EDUCATION
            </h3>
            <ul class="info-list" id="profile-education"></ul>
          </section>
          <section class="info-box">
            <h3 class="info-title">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"/></svg>
              SKILLS &amp; TOOLS
            </h3>
            <ul class="skill-list" id="profile-skills"></ul>
          </section>
          <section class="info-box">
            <h3 class="info-title">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>
              EXPERIENCE
            </h3>
            <ul class="info-list" id="profile-experience"></ul>
          </section>
        </div>

        <section class="highlights">
          <h3 class="small-label">PORTFOLIO HIGHLIGHTS</h3>
          <ul class="cards" id="card-list"></ul>
          <p class="empty" id="card-empty" hidden>아직 등록된 프로젝트가 없어요.</p>
        </section>

        <blockquote class="quote" id="profile-quote"></blockquote>
      </section>
    </div>

    <!-- 방명록 -->
    <section class="sheet guestbook">
      <h2 class="small-label">GUESTBOOK</h2>
      <form class="guest-form" id="guest-form">
        <div class="guest-fields">
          <label class="field">
            <span>별명</span>
            <input type="text" id="guest-nickname" maxlength="20" placeholder="별명 (20자까지)">
          </label>
          <label class="field field-wide">
            <span>한마디</span>
            <textarea id="guest-message" rows="2" maxlength="200" placeholder="한마디 남겨 주세요 (200자까지)"></textarea>
          </label>
        </div>
        <div class="guest-actions">
          <p class="guest-status" id="guest-status" aria-live="polite"></p>
          <button type="button" class="guest-submit" id="guest-submit">남기기</button>
        </div>
      </form>
      <ul class="guest-list" id="guest-list"></ul>
      <p class="empty" id="guest-empty" hidden>아직 남겨진 글이 없어요. 첫 글을 남겨 주세요!</p>
    </section>

    <footer class="site-footer">
      <a href="admin.html">관리자</a>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
